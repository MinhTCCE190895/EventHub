<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Khôi phục mật khẩu EventHub</title>
</head>
<body style="margin:0;background:#f5f7fb;font-family:Arial,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;background:#f5f7fb;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:12px;padding:32px;box-shadow:0 8px 24px rgba(15,23,42,.08);">
                    <tr>
                        <td>
                            <h2 style="margin:0 0 20px;color:#4f46e5;">Khôi phục mật khẩu</h2>
                            <p>Xin chào <strong>{{FullName}}</strong>,</p>
                            <p>Bạn đã yêu cầu đặt lại mật khẩu cho tài khoản EventHub.</p>
                            <div style="margin:24px 0;padding:18px;text-align:center;background:#eef2ff;border-radius:10px;">
                                <div style="margin-bottom:8px;font-size:13px;color:#64748b;">Mã xác thực của bạn</div>
                                <strong style="font-size:30px;letter-spacing:8px;color:#4f46e5;">{{Otp}}</strong>
                            </div>
                            <p>Mã này có hiệu lực trong <strong>5 phút</strong>. Không chia sẻ mã với bất kỳ ai.</p>
                            <p style="margin-top:28px;color:#64748b;">Trân trọng,<br />Đội ngũ UniEvent Hub</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
